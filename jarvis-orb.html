<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Jarvis</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300;9..144,500&family=Inter:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/marked@11.0.0/marked.min.js"></script>
<style>
  :root{
    --void:#0a0908;
    --panel: rgba(20,17,13,0.65);
    --panel-border: rgba(201,166,104,0.14);
    --gold: #c9a668;
    --gold-bright:#e8c992;
    --text: #efe9de;
    --text-dim: #8b8478;
    --user-bg: rgba(201,166,104,0.12);
    --success: #8fbc8f;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html,body{
    width:100%; height:100%; overflow:hidden;
    background: var(--void);
    font-family:'Inter',sans-serif;
    color: var(--text);
  }
  #scene{position:fixed; inset:0; z-index:0; transition: opacity .6s ease;}
  body.conversation #scene{ opacity:0.35; }

  /* Grid de fondo sutil */
  #grid{
    position:fixed; inset:0; z-index:0; pointer-events:none;
    background-image:
      linear-gradient(rgba(201,166,104,0.025) 1px, transparent 1px),
      linear-gradient(90deg, rgba(201,166,104,0.025) 1px, transparent 1px);
    background-size: 60px 60px;
    opacity:0.6;
  }

  #vignette{
    position:fixed; inset:0; z-index:1; pointer-events:none;
    background: radial-gradient(ellipse at 50% 40%, transparent 0%, transparent 40%, rgba(10,9,8,0.65) 100%);
  }

  header{
    position:fixed; top:0; left:0; right:0; z-index:5;
    display:flex; align-items:center; justify-content:space-between;
    padding: 26px 44px; pointer-events:none;
  }
  .wordmark{
    font-family:'Fraunces', serif; font-weight:500; font-size:1.4rem;
    letter-spacing:0.01em; color: var(--text);
  }
  .wordmark span{ color: var(--gold); font-style:italic; font-weight:300; }

  /* Status bar enriquecida */
  .status{
    display:flex; align-items:center; gap:10px;
    font-size: 0.72rem; letter-spacing: 0.06em; color: var(--text-dim);
    pointer-events:auto;
  }
  .status .dot{
    width:6px; height:6px; border-radius:50%;
    background: var(--gold); box-shadow: 0 0 8px var(--gold);
    transition: background .4s ease, box-shadow .4s ease;
  }
  .status.listening .dot{ background:#e6cf9a; box-shadow:0 0 12px #e6cf9a; animation: pulse 1s infinite;}
  .status.thinking .dot{ background:#9ab8c9; box-shadow:0 0 12px #9ab8c9; animation: pulse 1s infinite;}
  .status.speaking .dot{ background:#c98f8f; box-shadow:0 0 12px #c98f8f;}
  @keyframes pulse { 0%,100%{opacity:1;} 50%{opacity:0.4;} }

  .status .sep{ color: rgba(201,166,104,0.3); }
  .status .meta{
    font-family:'JetBrains Mono', monospace;
    font-size: 0.68rem;
    color: var(--gold);
    opacity: 0.7;
    text-transform: lowercase;
    transition: opacity .3s ease;
  }
  .status .meta.flash{
    opacity: 1;
    color: var(--gold-bright);
    text-shadow: 0 0 8px var(--gold);
  }

  #transcript{
    position:fixed; left:50%; top:88px; transform:translate(-50%, -16px);
    z-index:4; width:min(680px, 90vw); max-height: calc(100vh - 280px);
    display:flex; flex-direction:column; gap:10px;
    overflow-y:auto; padding: 4px 6px 10px;
    opacity:0; pointer-events:none;
    transition: opacity .4s ease, transform .4s ease;
  }
  body.conversation #transcript{
    opacity:1; transform:translate(-50%,0); pointer-events:auto;
  }
  #transcript::-webkit-scrollbar { width: 6px; }
  #transcript::-webkit-scrollbar-thumb { background: rgba(201,166,104,0.25); border-radius: 3px; }
  .bubble{
    max-width:80%; padding:12px 16px; border-radius:16px;
    font-size:0.92rem; line-height:1.55;
    background: var(--panel); border:1px solid var(--panel-border);
    backdrop-filter: blur(14px);
    animation: rise .35s ease both;
    white-space: pre-wrap; word-wrap: break-word;
  }
.bubble.user{
    align-self:flex-end;
    background: var(--user-bg);
    border-color: rgba(201,166,104,0.28);
  }
  .bubble.jarvis{ align-self:flex-start; }

  /* Markdown dentro de las burbujas */
  .markdown-body { font-size: 0.92rem; line-height: 1.6; }
  .markdown-body p { margin: 0 0 0.6em 0; }
  .markdown-body p:last-child { margin-bottom: 0; }
  .markdown-body strong { color: var(--gold-bright); font-weight: 600; }
  .markdown-body em { font-style: italic; }
  .markdown-body h1, .markdown-body h2, .markdown-body h3 {
    font-family: 'Fraunces', serif;
    font-weight: 500;
    color: var(--gold-bright);
    margin: 0.8em 0 0.4em 0;
    letter-spacing: 0.01em;
  }
  .markdown-body h1 { font-size: 1.2rem; }
  .markdown-body h2 { font-size: 1.1rem; }
  .markdown-body h3 { font-size: 1rem; }
  .markdown-body ul, .markdown-body ol {
    margin: 0.4em 0 0.6em 1.4em;
    padding-left: 0;
  }
  .markdown-body li { margin: 0.25em 0; }
  .markdown-body code {
    font-family: 'JetBrains Mono', monospace;
    background: rgba(201,166,104,0.1);
    border: 1px solid rgba(201,166,104,0.18);
    padding: 0.1em 0.35em;
    border-radius: 4px;
    font-size: 0.85em;
    color: var(--gold-bright);
  }
  .markdown-body pre {
    background: rgba(0,0,0,0.4);
    border: 1px solid rgba(201,166,104,0.15);
    border-radius: 8px;
    padding: 0.75em 1em;
    margin: 0.5em 0;
    overflow-x: auto;
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.82rem;
    line-height: 1.5;
  }
  .markdown-body pre code {
    background: none;
    border: none;
    padding: 0;
    color: var(--text);
  }
  .markdown-body blockquote {
    border-left: 2px solid var(--gold);
    padding-left: 0.8em;
    margin: 0.5em 0;
    color: var(--text-dim);
    font-style: italic;
  }
  .markdown-body a { color: var(--gold-bright); text-decoration: underline; }
  .markdown-body hr {
    border: none;
    border-top: 1px solid rgba(201,166,104,0.2);
    margin: 0.8em 0;
  }

  /* Artefactos: imagenes y archivos generados */
  .bubble .artifacts {
    margin-top: 10px;
    padding-top: 10px;
    border-top: 1px dashed rgba(201,166,104,0.15);
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .bubble .artifact-image-wrap {
    position: relative;
    display: inline-block;
    max-width: 100%;
  }
  .bubble .artifact-image {
    max-width: 100%;
    border-radius: 10px;
    border: 1px solid rgba(201,166,104,0.25);
    cursor: pointer;
    transition: transform .2s ease, border-color .2s ease;
    display: block;
  }
  .bubble .artifact-image:hover {
    border-color: var(--gold);
    transform: scale(1.01);
  }
  .bubble .artifact-actions {
    position: absolute;
    bottom: 8px;
    right: 8px;
    display: flex;
    gap: 6px;
    opacity: 0;
    transition: opacity .2s ease;
  }
  .bubble .artifact-image-wrap:hover .artifact-actions {
    opacity: 1;
  }
  .bubble .artifact-btn {
    font-size: 0.7rem;
    font-family: 'Inter', sans-serif;
    letter-spacing: 0.03em;
    padding: 6px 10px;
    border-radius: 6px;
    background: rgba(10,9,8,0.85);
    color: var(--gold-bright);
    border: 1px solid rgba(201,166,104,0.4);
    cursor: pointer;
    backdrop-filter: blur(8px);
    transition: background .15s ease, border-color .15s ease;
  }
  .bubble .artifact-btn:hover {
    background: rgba(201,166,104,0.25);
    border-color: var(--gold);
  }
  .bubble .artifact-btn.success {
    background: rgba(120,180,120,0.35);
    border-color: var(--success);
    color: #d4f0d4;
  }
  .bubble .artifact-file {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 8px 12px;
    background: rgba(201,166,104,0.06);
    border: 1px solid rgba(201,166,104,0.2);
    border-radius: 10px;
    cursor: pointer;
    transition: background .2s ease, border-color .2s ease;
    font-size: 0.85rem;
  }
  .bubble .artifact-file:hover {
    background: rgba(201,166,104,0.14);
    border-color: var(--gold);
  }
  .bubble .artifact-file .icon {
    font-size: 1.2rem;
    flex: none;
  }
  .bubble .artifact-file .name {
    flex: 1;
    color: var(--gold-bright);
    word-break: break-all;
    font-size: 0.82rem;
    font-family: 'JetBrains Mono', monospace;
  }
  .bubble .artifact-file .action {
    font-size: 0.7rem;
    color: var(--text-dim);
    letter-spacing: 0.04em;
    text-transform: uppercase;
    flex: none;
  }

  .bubble .thought{
    font-size:0.75rem; color:var(--text-dim);
    margin-top:8px; padding-top:8px;
    border-top: 1px dashed rgba(201,166,104,0.15);
    font-style: italic;
  }
  
  .bubble.thinking{
    color: var(--text-dim); font-style: italic;
    display: flex; align-items: center; gap: 8px;
  }
  .bubble.thinking::after{
    content:""; width:8px; height:8px; border-radius:50%;
    background: var(--gold); animation: blink 1s infinite;
  }
  @keyframes blink { 0%,100%{opacity:1;} 50%{opacity:0.2;} }
  @keyframes rise{ from{opacity:0; transform:translateY(8px);} to{opacity:1; transform:translateY(0);} }

  #closeChat{
    position:fixed; top:88px; right: calc(50% - min(340px, 45vw) - 20px);
    z-index: 5; width: 32px; height: 32px; border-radius: 50%;
    background: var(--panel); border: 1px solid var(--panel-border);
    color: var(--text-dim); cursor: pointer;
    display: none; align-items: center; justify-content: center;
    font-size: 14px; transition: all .2s ease; backdrop-filter: blur(14px);
  }
  body.conversation #closeChat{ display: flex; }
  #closeChat:hover{ color: var(--gold); border-color: var(--gold); }

  #dock{
    position:fixed; bottom:36px; left:50%; transform:translateX(-50%);
    z-index:6; width:min(680px, 90vw);
    display:flex; flex-direction:column; align-items:center; gap:12px;
  }
  #chips{ display:flex; gap:8px; flex-wrap:wrap; justify-content:center; }
  .chip{
    font-size:0.72rem; letter-spacing:.02em; color:var(--text-dim);
    border:1px solid var(--panel-border); background: var(--panel);
    backdrop-filter: blur(14px);
    padding:7px 14px; border-radius:999px; cursor:pointer;
    transition: border-color .2s ease, color .2s ease;
  }
  .chip:hover{ border-color: var(--gold); color: var(--gold-bright); }

  #inputRow{
    width:100%; display:flex; align-items:center; gap:8px;
    background: var(--panel); border: 1px solid var(--panel-border);
    backdrop-filter: blur(18px); border-radius: 999px;
    padding: 8px 8px 8px 22px;
    box-shadow: 0 12px 40px rgba(0,0,0,0.35);
    transition: border-color .2s ease;
  }
  #inputRow:focus-within{ border-color: rgba(201,166,104,0.4); }
  #inputRow input{
    flex:1; background:none; border:none; outline:none;
    color: var(--text); font-family:'Inter',sans-serif; font-size:0.92rem;
  }
  #inputRow input::placeholder{ color: var(--text-dim); }
  .roundBtn{
    width:40px; height:40px; border-radius:50%;
    border:1px solid var(--panel-border);
    background: rgba(201,166,104,0.08);
    display:flex; align-items:center; justify-content:center;
    cursor:pointer; flex:none;
    transition: background .2s ease, border-color .2s ease, transform .15s ease;
  }
  .roundBtn:hover{ border-color: var(--gold); background: rgba(201,166,104,0.16); }
  .roundBtn:active{ transform: scale(0.94); }
  .roundBtn svg{ width:16px; height:16px; stroke: var(--gold-bright); }
  #mic.recording{
    background: rgba(201,120,120,0.28);
    border-color: #c98f8f; animation: pulse 1s infinite;
  }
  #hint{ font-size:0.68rem; color: var(--text-dim); letter-spacing:.03em; opacity:0.7; }
    /* Overlay de drag & drop */
  #dropOverlay{
    position:fixed; inset:0; z-index:100;
    background: rgba(10,9,8,0.85);
    backdrop-filter: blur(8px);
    display:none; align-items:center; justify-content:center;
    border: 3px dashed var(--gold);
    border-radius: 8px;
  }
  #dropOverlay.active{ display:flex; }
  #dropOverlay .message{
    font-family: 'Fraunces', serif;
    font-size: 1.6rem;
    color: var(--gold-bright);
    text-align: center;
    padding: 40px;
    border: 2px solid var(--gold);
    border-radius: 12px;
    background: rgba(20,17,13,0.7);
  }
  #dropOverlay .message .small{
    display: block;
    font-family: 'Inter', sans-serif;
    font-size: 0.9rem;
    color: var(--text-dim);
    margin-top: 12px;
    font-style: italic;
  }
</style>
</head>
<body>

<div id="grid"></div>
<div id="scene"></div>
<div id="vignette"></div>
<div id="dropOverlay">
  <div class="message">
    Suelta el archivo aqui
    <span class="small">Se guardara en sandbox/uploads/</span>
  </div>
</div>

<header>
  <div class="wordmark">JARVIS <span>asistente</span></div>
  <div class="status" id="status">
    <span class="dot"></span>
    <span id="statusText">EN ESPERA</span>
    <span class="sep">·</span>
    <span class="meta" id="lastSkill">listo</span>
  </div>
</header>

<button id="closeChat" title="Cerrar chat">✕</button>
<div id="transcript"></div>

<div id="dock">
  <div id="chips">
    <div class="chip" data-cmd="Sube el volumen">Vol +</div>
    <div class="chip" data-cmd="Toma una captura">Captura</div>
    <div class="chip" data-cmd="Lee mis notas">Notas</div>
    <div class="chip" data-cmd="Recuérdame en un minuto tomar agua">Recordatorio</div>
  </div>
  <div id="inputRow">
    <input id="textInput" type="text" placeholder="Escribe o habla con Jarvis…">
    <div class="roundBtn" id="mic" title="Hablar">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"></path>
        <path d="M19 10v2a7 7 0 0 1-14 0v-2"></path>
        <line x1="12" y1="19" x2="12" y2="23"></line>
      </svg>
    </div>
  </div>
  <div id="hint">Escribe, toca la esfera o usa el micrófono</div>
</div>

<script>
// ═══════════════════════════════════════════════════════════
// SISTEMA DE SONIDO (Web Audio API, sin archivos externos)
// ═══════════════════════════════════════════════════════════
let audioCtx = null;

function getAudioCtx() {
  if (!audioCtx) {
    try {
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    } catch(e) {
      console.warn('[SOUND] No audio context', e);
    }
  }
  return audioCtx;
}

function playTone(freq, duration, type = 'sine', volume = 0.06, when = 0) {
  try {
    const ctx = getAudioCtx();
    if (!ctx) return;
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.type = type;
    osc.frequency.value = freq;
    const t = ctx.currentTime + when;
    gain.gain.setValueAtTime(0.0001, t);
    gain.gain.exponentialRampToValueAtTime(volume, t + 0.01);
    gain.gain.exponentialRampToValueAtTime(0.0001, t + duration);
    osc.connect(gain);
    gain.connect(ctx.destination);
    osc.start(t);
    osc.stop(t + duration + 0.02);
  } catch(e) { console.warn('[SOUND]', e); }
}

function soundListening() {
  playTone(880, 0.06, 'sine', 0.05, 0);
  playTone(1100, 0.08, 'sine', 0.04, 0.04);
}

function soundThinking() {
  playTone(440, 0.12, 'sine', 0.04, 0);
  playTone(550, 0.14, 'sine', 0.04, 0.09);
}

function soundSpeaking() {
  playTone(660, 0.08, 'sine', 0.05, 0);
}

function soundSuccess() {
  playTone(880, 0.08, 'sine', 0.05, 0);
  playTone(1320, 0.12, 'sine', 0.05, 0.06);
}

function soundError() {
  playTone(220, 0.15, 'triangle', 0.06, 0);
  playTone(180, 0.2, 'triangle', 0.05, 0.12);
}

// ═══════════════════════════════════════════════════════════
// THREE.JS ORB
// ═══════════════════════════════════════════════════════════
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(45, window.innerWidth/window.innerHeight, 0.1, 100);
camera.position.set(0, 0, 6.2);

const renderer = new THREE.WebGLRenderer({ antialias:true, alpha:true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
document.getElementById('scene').appendChild(renderer.domElement);

const PALETTE = {
  idle:      new THREE.Color(0xc9a668),
  listening: new THREE.Color(0xe6cf9a),
  thinking:  new THREE.Color(0x9ab8c9),
  speaking:  new THREE.Color(0xc98f8f)
};
let currentState = 'idle';
let energy = 0.35, targetEnergy = 0.35;
let orbScale = 1, targetScale = 1, orbY = 0, targetY = 0;

const uniforms = {
  uTime: { value: 0 },
  uEnergy: { value: energy },
  uColor: { value: PALETTE.idle.clone() }
};

const vertexShader = `
  uniform float uTime;
  uniform float uEnergy;
  varying float vDisp;
  vec3 hash3(vec3 p){
    p = vec3( dot(p,vec3(127.1,311.7,74.7)),
              dot(p,vec3(269.5,183.3,246.1)),
              dot(p,vec3(113.5,271.9,124.6)) );
    return -1.0 + 2.0*fract(sin(p)*43758.5453123);
  }
  float noise(vec3 p){
    vec3 i = floor(p); vec3 f = fract(p); vec3 u = f*f*(3.0-2.0*f);
    return mix(
      mix( mix(dot(hash3(i+vec3(0,0,0)), f-vec3(0,0,0)),
               dot(hash3(i+vec3(1,0,0)), f-vec3(1,0,0)), u.x),
           mix(dot(hash3(i+vec3(0,1,0)), f-vec3(0,1,0)),
               dot(hash3(i+vec3(1,1,0)), f-vec3(1,1,0)), u.x), u.y),
      mix( mix(dot(hash3(i+vec3(0,0,1)), f-vec3(0,0,1)),
               dot(hash3(i+vec3(1,0,1)), f-vec3(1,0,1)), u.x),
           mix(dot(hash3(i+vec3(0,1,1)), f-vec3(0,1,1)),
               dot(hash3(i+vec3(1,1,1)), f-vec3(1,1,1)), u.x), u.y), u.z);
  }
  void main(){
    float n = noise(position * 1.6 + uTime * 0.35);
    float disp = n * uEnergy;
    vDisp = disp;
    vec3 newPos = position + normal * disp;
    gl_Position = projectionMatrix * modelViewMatrix * vec4(newPos, 1.0);
  }
`;

const fragmentShader = `
  uniform vec3 uColor;
  varying float vDisp;
  void main(){
    float glow = smoothstep(-0.4, 0.6, vDisp) * 0.5 + 0.5;
    vec3 col = uColor * glow;
    gl_FragColor = vec4(col, 1.0);
  }
`;

const orb = new THREE.Mesh(
  new THREE.IcosahedronGeometry(1.35, 64),
  new THREE.ShaderMaterial({ uniforms, vertexShader, fragmentShader })
);
scene.add(orb);

const wireShell = new THREE.Mesh(
  new THREE.IcosahedronGeometry(1.62, 2),
  new THREE.MeshBasicMaterial({ color: 0xc9a668, wireframe:true, transparent:true, opacity:0.08 })
);
scene.add(wireShell);

const glow = new THREE.Mesh(
  new THREE.SphereGeometry(1.9, 32, 32),
  new THREE.MeshBasicMaterial({ color: 0xc9a668, transparent:true, opacity:0.05, side: THREE.BackSide })
);
scene.add(glow);

window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth/window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

let mouseX = 0, mouseY = 0;
window.addEventListener('mousemove', e => {
  mouseX = (e.clientX / window.innerWidth - 0.5);
  mouseY = (e.clientY / window.innerHeight - 0.5);
});

const clock = new THREE.Clock();
function animate(){
  requestAnimationFrame(animate);
  const t = clock.getElapsedTime();
  uniforms.uTime.value = t;
  energy += (targetEnergy - energy) * 0.06;
  uniforms.uEnergy.value = energy * (1 + Math.sin(t*1.4)*0.06);
  orbScale += (targetScale - orbScale) * 0.08;
  orbY += (targetY - orbY) * 0.08;
  orb.rotation.y = t * 0.12;
  orb.rotation.x = Math.sin(t*0.2) * 0.08;
  wireShell.rotation.y = -t * 0.05;
  wireShell.rotation.x = mouseY * 0.3;
  orb.position.y = orbY; orb.scale.setScalar(orbScale);
  wireShell.position.y = orbY; wireShell.scale.setScalar(orbScale);
  glow.position.y = orbY; glow.scale.setScalar(orbScale);
  camera.position.x += (mouseX*0.6 - camera.position.x) * 0.03;
  camera.position.y += (-mouseY*0.4 - camera.position.y) * 0.03;
  camera.lookAt(0, orbY, 0);
  const target = PALETTE[currentState];
  uniforms.uColor.value.lerp(target, 0.04);
  glow.material.color.lerp(target, 0.04);
  wireShell.material.color.lerp(target, 0.04);
  renderer.render(scene, camera);
}
animate();

// ═══════════════════════════════════════════════════════════
// ESTADO
// ═══════════════════════════════════════════════════════════
const statusEl = document.getElementById('status');
const statusText = document.getElementById('statusText');
const lastSkillEl = document.getElementById('lastSkill');
const transcriptEl = document.getElementById('transcript');

const LABELS = { idle:'EN ESPERA', listening:'ESCUCHANDO', thinking:'PENSANDO', speaking:'RESPONDIENDO' };
const ENERGY = { idle:0.22, listening:0.5, thinking:0.7, speaking:0.9 };

let lastState = 'idle';

function setState(state){
  if (state === lastState) return;
  const prev = lastState;
  lastState = state;
  currentState = state;
  targetEnergy = ENERGY[state];
  statusEl.className = 'status ' + state;
  statusText.textContent = LABELS[state];

  // Sonidos de transición
  if (state === 'listening' && prev === 'idle') soundListening();
  else if (state === 'thinking' && prev === 'listening') soundThinking();
  else if (state === 'speaking' && prev === 'thinking') soundSpeaking();
}

function setLastSkill(skill, flash = true) {
  lastSkillEl.textContent = skill;
  if (flash) {
    lastSkillEl.classList.add('flash');
    setTimeout(() => lastSkillEl.classList.remove('flash'), 800);
  }
}

function enterConversation(){
  document.body.classList.add('conversation');
  targetScale = 0.55; targetY = 1.9;
}

function exitConversation(){
  document.body.classList.remove('conversation');
  targetScale = 1; targetY = 0;
  transcriptEl.innerHTML = '';
}

document.getElementById('closeChat').addEventListener('click', exitConversation);

// ═══════════════════════════════════════════════════════════
// MENSAJES
// ═══════════════════════════════════════════════════════════
function addMessage(role, text, thought, artifacts){
  const msg = document.createElement('div');
  msg.className = 'bubble ' + role;

  let contentHtml;
  if (role === 'user') {
    contentHtml = escapeHtml(text);
  } else {
    try {
      if (typeof marked !== 'undefined') {
        marked.setOptions({ breaks: true, gfm: true });
        contentHtml = marked.parse(text);
      } else {
        contentHtml = escapeHtml(text);
      }
    } catch(e) {
      console.warn('[MD]', e);
      contentHtml = escapeHtml(text);
    }
  }

  let html = `<div class="markdown-body">${contentHtml}</div>`;

  if (artifacts && artifacts.length > 0) {
    html += '<div class="artifacts">';
    for (const a of artifacts) {
      if (a.type === 'image' && a.url) {
        const safeUrl = escapeHtml(a.url);
        const safeName = escapeHtml(a.name);
        const safePath = escapeHtml(a.path || '');
        html += `<div class="artifact-image-wrap">
          <img class="artifact-image" src="${safeUrl}" alt="${safeName}" data-url="${safeUrl}">
          <div class="artifact-actions">
            <button class="artifact-btn" data-action="copy" data-url="${safeUrl}">Copiar</button>
            <button class="artifact-btn" data-action="open-folder" data-path="${safePath}">Carpeta</button>
          </div>
        </div>`;
      } else if (a.type === 'document' || a.type === 'code') {
        const icon = a.type === 'document' ? '📄' : '📝';
        const action = a.exists ? 'Abrir' : 'No existe';
        const safePath = escapeHtml(a.path);
        const safeName = escapeHtml(a.name);
        html += `<div class="artifact-file" data-path="${safePath}">
          <span class="icon">${icon}</span>
          <span class="name">${safeName}</span>
          <span class="action">${action}</span>
        </div>`;
      }
    }
    html += '</div>';
  }

  if (thought) {
    html += `<div class="thought">🤔 ${escapeHtml(thought)}</div>`;
  }

  msg.innerHTML = html;

  // Click handlers
  msg.querySelectorAll('.artifact-image').forEach(img => {
    img.addEventListener('click', (e) => {
      if (e.target.classList.contains('artifact-btn')) return;
      window.open(img.dataset.url, '_blank');
    });
  });
  msg.querySelectorAll('.artifact-file').forEach(div => {
    div.addEventListener('click', () => openArtifact(div.dataset.path));
  });
  msg.querySelectorAll('.artifact-btn').forEach(btn => {
    btn.addEventListener('click', async (e) => {
      e.stopPropagation();
      const action = btn.dataset.action;
      if (action === 'copy') {
        await copyImage(btn.dataset.url, btn);
      } else if (action === 'open-folder') {
        await openFolder(btn.dataset.path);
      }
    });
  });

  transcriptEl.appendChild(msg);
  transcriptEl.scrollTop = transcriptEl.scrollHeight;
  return msg;
}
async function copyImage(url, btn) {
  const originalText = btn.textContent;
  try {
    // Convertir URL (/sandbox/...) a path absoluto para el backend
    const path = await urlToAbsolutePath(url);
    if (!path) throw new Error('No pude resolver la ruta');

    const res = await fetch('/copy_image?path=' + encodeURIComponent(path), {
      method: 'POST',
    });
    
    const data = await res.json();
    if (!data.ok) {
      throw new Error(data.error || 'Error desconocido');
    }

    btn.textContent = 'Copiado';
    btn.classList.add('success');
    soundSuccess();
    setTimeout(() => {
      btn.textContent = originalText;
      btn.classList.remove('success');
    }, 1500);

  } catch (e) {
    console.error('[COPY]', e);
    btn.textContent = 'Error';
    btn.title = e.message;
    soundError();
    setTimeout(() => {
      btn.textContent = originalText;
      btn.title = '';
    }, 2500);
  }
}

// Convierte una URL tipo /sandbox/images/foo.jpg al path absoluto C:\JARVIS\sandbox\images\foo.jpg
async function urlToAbsolutePath(url) {
  try {
    // Pedirle al backend que resuelva la ruta desde la URL
    const res = await fetch('/resolve_url?url=' + encodeURIComponent(url));
    if (!res.ok) return null;
    const data = await res.json();
    return data.ok ? data.path : null;
  } catch (e) {
    console.error('[RESOLVE]', e);
    return null;
  }
}
async function openFolder(path) {
  try {
    const folder = path.substring(0, path.lastIndexOf('\\'));
    await fetch('/open_file?path=' + encodeURIComponent(folder), { method: 'POST' });
  } catch (e) {
    console.error('[OPEN FOLDER]', e);
  }
}

async function openArtifact(path) {
  try {
    const res = await fetch('/open_file?path=' + encodeURIComponent(path), {
      method: 'POST',
    });
    const data = await res.json();
    if (!data.ok) {
      alert('No se pudo abrir: ' + (data.error || 'error desconocido'));
    }
  } catch (e) {
    alert('Error al abrir: ' + e.message);
  }
}

function addThinkingMessage(){
  const msg = document.createElement('div');
  msg.className = 'bubble jarvis thinking';
  msg.textContent = 'Pensando';
  transcriptEl.appendChild(msg);
  transcriptEl.scrollTop = transcriptEl.scrollHeight;
  return msg;
}

function escapeHtml(text){
  const div = document.createElement('div');
  div.textContent = text;
  return div.innerHTML;
}

// ═══════════════════════════════════════════════════════════
// API
// ═══════════════════════════════════════════════════════════
const SPEAK_REPLIES = true;

async function respondTo(cmd){
  if (!cmd || !cmd.trim()) return;

  if ('speechSynthesis' in window) {
    speechSynthesis.cancel();
  }

  enterConversation();
  setState('thinking');
  addMessage('user', cmd);
  const thinkingMsg = addThinkingMessage();

  let data;
  try {
    const res = await fetch('/chat', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ text: cmd })
    });
    data = await res.json();
  } catch (err) {
    console.error('[ERROR]', err);
    thinkingMsg.remove();
    addMessage('jarvis', '⚠️ No pude conectar con el servidor.');
    setState('idle');
    soundError();
    return;
  }

  thinkingMsg.remove();

  const reply = data.text || 'Listo.';
  const voice = data.voice || reply;
  const artifacts = data.artifacts || [];

  // Actualizar status bar
  if (data.type) {
    setLastSkill(data.type === 'chat' ? 'conversacion' : 'comando');
  }

  addMessage('jarvis', reply, data.thought, artifacts);

  setState('speaking');
  if (SPEAK_REPLIES && 'speechSynthesis' in window) {
    const utter = new SpeechSynthesisUtterance(voice);
    utter.lang = 'es-PE';
    utter.rate = 1.05;
    utter.onend = () => setState('idle');
    utter.onerror = () => setState('idle');
    speechSynthesis.speak(utter);
  } else {
    setTimeout(() => setState('idle'), 2000);
  }
}

// CHIPS

document.querySelectorAll('.chip').forEach(chip => {

// ═══════════════════════════════════════════════════════════
// MICRÓFONO — MediaRecorder + Whisper del servidor
// ═══════════════════════════════════════════════════════════
const micBtn = document.getElementById('mic');

let mediaRecorder = null;
let audioChunks = [];
let currentStream = null;
let audioContext = null;
let analyser = null;
let silenceStart = null;
let hasSpoken = false;
let recordingStartTime = 0;
let monitorInterval = null;

const SILENCE_THRESHOLD = 12;
const SILENCE_DURATION_MS = 1200;
const MAX_RECORDING_MS = 15000;
const MIN_RECORDING_MS = 400;

async function startRecording() {
  if (mediaRecorder && mediaRecorder.state === 'recording') {
    console.log('[MIC] Ya esta grabando');
    return;
  }

  try {
    currentStream = await navigator.mediaDevices.getUserMedia({
      audio: {
        echoCancellation: true,
        noiseSuppression: true,
        autoGainControl: true,
      }
    });
  } catch (err) {
    console.error('[MIC] Error:', err);
    enterConversation();
    addMessage('jarvis', '⚠️ No pude acceder al micrófono. Verifica permisos.');
    setState('idle');
    soundError();
    return;
  }

  console.log('[MIC] Iniciando grabacion...');
  micBtn.classList.add('recording');
  setState('listening');
  input.placeholder = 'Escuchando... habla con naturalidad';

  audioChunks = [];
  hasSpoken = false;
  silenceStart = null;
  recordingStartTime = Date.now();

  try {
    audioContext = new (window.AudioContext || window.webkitAudioContext)();
    const source = audioContext.createMediaStreamSource(currentStream);
    analyser = audioContext.createAnalyser();
    analyser.fftSize = 512;
    source.connect(analyser);
  } catch (e) {
    console.warn('[MIC] No se pudo iniciar analyser:', e);
  }

  let mimeType = 'audio/webm;codecs=opus';
  if (!MediaRecorder.isTypeSupported(mimeType)) mimeType = 'audio/webm';
  if (!MediaRecorder.isTypeSupported(mimeType)) mimeType = 'audio/ogg;codecs=opus';
  if (!MediaRecorder.isTypeSupported(mimeType)) mimeType = '';

  const options = mimeType ? { mimeType } : {};
  mediaRecorder = new MediaRecorder(currentStream, options);

  mediaRecorder.ondataavailable = (e) => {
    if (e.data.size > 0) audioChunks.push(e.data);
  };

  mediaRecorder.onstop = async () => {
    clearInterval(monitorInterval);
    micBtn.classList.remove('recording');
    input.placeholder = 'Transcribiendo...';

    const duration = Date.now() - recordingStartTime;
    console.log('[MIC] Grabacion terminada. Duracion:', duration, 'ms');

    if (duration < MIN_RECORDING_MS) {
      console.log('[MIC] Muy corto, ignorado');
      cleanup();
      setState('idle');
      input.placeholder = 'Escribe o habla con Jarvis…';
      return;
    }

    const blob = new Blob(audioChunks, {
      type: mediaRecorder.mimeType || 'audio/webm',
    });
    cleanup();

    console.log('[MIC] Blob size:', blob.size, 'bytes');

    if (blob.size < 1000) {
      setState('idle');
      input.placeholder = 'Escribe o habla con Jarvis…';
      return;
    }

    await transcribeAndSend(blob);
  };

  mediaRecorder.start(100);

  monitorInterval = setInterval(() => {
    if (!analyser) return;
    const data = new Uint8Array(analyser.frequencyBinCount);
    analyser.getByteTimeDomainData(data);

    let sum = 0;
    for (let i = 0; i < data.length; i++) {
      const v = (data[i] - 128) / 128;
      sum += v * v;
    }
    const rms = Math.sqrt(sum / data.length) * 100;
    const elapsed = Date.now() - recordingStartTime;

    if (rms > SILENCE_THRESHOLD) {
      hasSpoken = true;
      silenceStart = null;
    } else if (hasSpoken) {
      if (silenceStart === null) {
        silenceStart = Date.now();
      } else if (Date.now() - silenceStart > SILENCE_DURATION_MS) {
        console.log('[MIC] Silencio detectado, parando...');
        stopRecording();
        return;
      }
    }

    if (elapsed > MAX_RECORDING_MS) {
      console.log('[MIC] Timeout, parando...');
      stopRecording();
    }
  }, 100);
}

function stopRecording() {
  if (mediaRecorder && mediaRecorder.state === 'recording') {
    try { mediaRecorder.stop(); } catch(e) { console.warn(e); }
  }
}

function cleanup() {
  if (currentStream) {
    try { currentStream.getTracks().forEach(t => t.stop()); } catch(e) {}
    currentStream = null;
  }
  if (audioContext) {
    try { audioContext.close(); } catch(e) {}
    audioContext = null;
  }
  analyser = null;
  mediaRecorder = null;
}

async function transcribeAndSend(blob) {
  setState('thinking');

  const formData = new FormData();
  formData.append('audio', blob, 'audio.webm');

  let data;
  try {
    const res = await fetch('/transcribe', {
      method: 'POST',
      body: formData,
    });
    data = await res.json();
    console.log('[TRANSCRIBE] Respuesta:', data);
  } catch (err) {
    console.error('[TRANSCRIBE] Error:', err);
    setState('idle');
    input.placeholder = 'Escribe o habla con Jarvis…';
    enterConversation();
    addMessage('jarvis', '⚠️ Error transcribiendo el audio.');
    soundError();
    return;
  }

  input.placeholder = 'Escribe o habla con Jarvis…';

  const text = (data.text || '').trim();
  if (!text) {
    console.log('[TRANSCRIBE] Texto vacio');
    setState('idle');
    return;
  }

  console.log('[TRANSCRIBE] Texto:', text);
  respondTo(text);
}

micBtn.addEventListener('click', () => {
  if (mediaRecorder && mediaRecorder.state === 'recording') {
    stopRecording();
  } else {
    startRecording();
  }
});

renderer.domElement.addEventListener('click', () => {
  if (currentState === 'idle') {
    startRecording();
  }
});

console.log('[JARVIS] Interfaz cargada correctamente');
// ═══════════════════════════════════════════════════════════
// DRAG & DROP — Subir archivos a sandbox/uploads/
// ═══════════════════════════════════════════════════════════
const dropOverlay = document.getElementById('dropOverlay');
let dragCounter = 0;

function preventDefaults(e) {
  e.preventDefault();
  e.stopPropagation();
}

document.addEventListener('dragenter', (e) => {
  preventDefaults(e);
  if (!e.dataTransfer || !e.dataTransfer.types.includes('Files')) return;
  dragCounter++;
  if (dragCounter === 1) {
    dropOverlay.classList.add('active');
  }
});

document.addEventListener('dragleave', (e) => {
  preventDefaults(e);
  dragCounter--;
  if (dragCounter <= 0) {
    dragCounter = 0;
    dropOverlay.classList.remove('active');
  }
});

document.addEventListener('dragover', (e) => {
  preventDefaults(e);
  if (e.dataTransfer) e.dataTransfer.dropEffect = 'copy';
});

document.addEventListener('drop', async (e) => {
  preventDefaults(e);
  dragCounter = 0;
  dropOverlay.classList.remove('active');

  if (!e.dataTransfer || !e.dataTransfer.files || e.dataTransfer.files.length === 0) {
    return;
  }

  const files = Array.from(e.dataTransfer.files);
  await uploadFiles(files);
});

async function uploadFiles(files) {
  enterConversation();
  setState('thinking');

  const uploaded = [];
  for (const file of files) {
    const formData = new FormData();
    formData.append('file', file, file.name);

    try {
      const res = await fetch('/upload', {
        method: 'POST',
        body: formData,
      });
      const data = await res.json();
      if (data.ok) {
        uploaded.push(data);
      } else {
        console.warn('[UPLOAD] Fallo:', data.error);
      }
    } catch (err) {
      console.error('[UPLOAD]', err);
    }
  }

  setState('idle');

  if (uploaded.length === 0) {
    addMessage('jarvis', '⚠️ No pude subir los archivos.');
    soundError();
    return;
  }

  soundSuccess();

  let msg = `📎 **${uploaded.length}** archivo(s) subido(s):\n\n`;
  for (const u of uploaded) {
    const size_kb = Math.round(u.size / 1024);
    msg += `- \`${u.name}\` (${size_kb} KB)\n`;
  }
  msg += `\n¿Qué quieres que haga con ${uploaded.length === 1 ? 'él' : 'ellos'}?`;

  addMessage('jarvis', msg);

  // Mensaje de voz simplificado
  if ('speechSynthesis' in window && SPEAK_REPLIES) {
    const utter = new SpeechSynthesisUtterance(
      `${uploaded.length} archivo subido. Que quieres que haga con el?`
    );
    utter.lang = 'es-PE';
    utter.rate = 1.05;
    speechSynthesis.speak(utter);
  }
}
